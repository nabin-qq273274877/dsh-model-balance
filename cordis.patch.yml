# dsh-model-balance bundle patch: inserts the plugin row into the profile
# roster. The row mounts BOTH halves: the host side (a deliberate no-op —
# all balance state lives client-side) and the browser side (the balance
# pill in front of the composer model seat, via the dsh.client declaration
# in package.json).
- insert:
    - id: model-balance
      name: 'dsh-model-balance'
